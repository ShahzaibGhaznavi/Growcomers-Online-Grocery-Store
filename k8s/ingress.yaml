apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: growcomers
  namespace: growcomers
spec:
  ingressClassName: nginx
  rules:
    - host: growcomers.local
      http:
        paths:
          - path: /address
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /brand
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /category
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /google
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /order
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /payment
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /product
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /review
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /wishlist
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /rate
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /python
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
