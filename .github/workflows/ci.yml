name: Growcomers CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: growcomers-frontend:ci
          build-args: |
            VITE_NODE_API_URL=http://localhost:4000
            VITE_PYTHON_API_URL=http://localhost:5000

      - name: Build Node backend
        uses: docker/build-push-action@v6
        with:
          context: ./nodeBackend
          push: false
          load: true
          tags: growcomers-backend:ci

      - name: Check Python syntax
        run: python -m py_compile pythonBackend/app.py pythonBackend/db.py

      - name: Build Python backend
        uses: docker/build-push-action@v6
        with:
          context: ./pythonBackend
          push: false
          load: true
          tags: growcomers-python-backend:ci

      - name: Scan images with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: growcomers-frontend:ci
          format: table
          vuln-type: os,library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan Node backend with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: growcomers-backend:ci
          format: table
          vuln-type: os,library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan Python backend with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: growcomers-python-backend:ci
          format: table
          vuln-type: os,library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
